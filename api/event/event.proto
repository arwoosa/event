syntax = "proto3";

package event;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "api/common.proto";

option go_package = "event/api/event";

// Console Event Service for brand management
service EventService {
  // Create a new event
  rpc CreateEvent(CreateEventRequest) returns (api.Response) {
    option (google.api.http) = {
      post: "/console/events"
      body: "*"
    };
  }
  
  // Get list of events with filtering and pagination
  rpc GetEventList(GetEventListRequest) returns (api.Response) {
    option (google.api.http) = {
      get: "/console/events"
    };
  }
  
  // Get a single event by ID
  rpc GetEvent(api.ID) returns (api.Response) {
    option (google.api.http) = {
      get: "/console/events/{id}"
    };
  }
  
  // Update event (full replacement)
  rpc UpdateEvent(UpdateEventRequest) returns (api.Response) {
    option (google.api.http) = {
      put: "/console/events/{id}"
      body: "*"
    };
  }
  
  // Patch event (partial update)
  rpc PatchEvent(PatchEventRequest) returns (api.Response) {
    option (google.api.http) = {
      patch: "/console/events/{id}"
      body: "*"
    };
  }
  
  // Delete an event
  rpc DeleteEvent(api.ID) returns (api.Response) {
    option (google.api.http) = {
      delete: "/console/events/{id}"
    };
  }
  
  // Update event status
  rpc UpdateEventStatus(UpdateEventStatusRequest) returns (api.Response) {
    option (google.api.http) = {
      put: "/console/events/{id}/status"
      body: "*"
    };
  }
}

// Public Event Service for front-end users
service PublicEventService {
  // Search public events
  rpc SearchEvents(SearchEventsRequest) returns (api.Response) {
    option (google.api.http) = {
      get: "/events"
    };
  }
  
  // Get a public event by ID (for sharing links)
  rpc GetEvent(api.ID) returns (api.Response) {
    option (google.api.http) = {
      get: "/events/{id}"
    };
  }
}

// Core Event message
message Event {
  string id = 1;
  string title = 2;
  string brand_id = 3;
  string summary = 4;
  string status = 5; // draft, published, archived
  string visibility = 6; // public, private
  string cover_image_url = 7;
  Location location = 8;
  repeated Session sessions = 9;
  Detail detail = 10;
  repeated FAQ faq = 11;
  string created_at = 12;
  string created_by = 13;
  string updated_at = 14;
  string updated_by = 15;
}

// Location with GeoJSON Point structure
message Location {
  string name = 1;
  string address = 2;
  string place_id = 3;
  GeoJSONPoint coordinates = 4;
}

message GeoJSONPoint {
  string type = 1; // Always "Point"
  repeated double coordinates = 2; // [longitude, latitude]
}

// Session for time-based event scheduling
message Session {
  string id = 1;
  string start_time = 2; // RFC3339 format
  string end_time = 3;   // RFC3339 format
}

// Event detail content
message Detail {
  string content = 1;
  string content_type = 2; // html, json, markdown
}

// FAQ entry
message FAQ {
  string question = 1;
  string answer = 2;
}

// Request messages
message CreateEventRequest {
  string title = 1;
  string summary = 2;
  string status = 3;
  string visibility = 4;
  string cover_image_url = 5;
  Location location = 6;
  repeated Session sessions = 7;
  Detail detail = 8;
  repeated FAQ faq = 9;
}

message GetEventListRequest {
  // Pagination
  optional string page_token = 1; // for cursor-based pagination
  optional int32 page = 2;        // for page-based pagination
  optional int32 page_size = 3;   // default 20, max 100
  
  // Filters
  optional string status = 4;     // draft|published|archived
  optional string visibility = 5; // public|private
  optional string session_start_time_from = 6; // RFC3339
  optional string session_start_time_to = 7;   // RFC3339
  optional string title_search = 8;           // full-text search
  
  // Sorting
  optional string sort_by = 9;    // created_at|updated_at|session_start_time
  optional string sort_order = 10; // asc|desc, default desc
}

message UpdateEventRequest {
  string id = 1;
  string title = 2;
  string summary = 3;
  string status = 4;
  string visibility = 5;
  string cover_image_url = 6;
  Location location = 7;
  repeated Session sessions = 8;
  Detail detail = 9;
  repeated FAQ faq = 10;
}

message PatchEventRequest {
  string id = 1;
  optional string title = 2;
  optional string summary = 3;
  optional string status = 4;
  optional string visibility = 5;
  optional string cover_image_url = 6;
  optional Location location = 7;
  repeated Session sessions = 8; // Replace all sessions if provided
  optional Detail detail = 9;
  repeated FAQ faq = 10; // Replace all FAQ if provided
}

message UpdateEventStatusRequest {
  string id = 1;
  string status = 2; // draft|published|archived
}

message SearchEventsRequest {
  // Pagination
  optional string page_token = 1;
  optional int32 page = 2;
  optional int32 page_size = 3;
  
  // Filters
  optional string brand_id = 4;     // filter by specific brand
  optional string title_search = 5; // full-text search
  optional string session_start_time_from = 6;
  optional string session_start_time_to = 7;
  
  // Location-based search
  optional double location_lat = 8;
  optional double location_lng = 9;
  optional int32 location_radius = 10; // in meters, default 1000
  
  // Sorting
  optional string sort_by = 11;    // session_start_time|created_at
  optional string sort_order = 12; // asc|desc
}

// Response messages
message EventResponse {
  Event event = 1;
}

message EventListResponse {
  repeated Event events = 1;
  Pagination pagination = 2;
}

message Pagination {
  optional string next_page_token = 1; // for cursor-based
  optional string prev_page_token = 2; // for cursor-based
  optional bool has_next = 3;
  optional bool has_prev = 4;
  optional int32 total_count = 5;
  optional int32 current_page = 6;     // for page-based
  optional int32 total_pages = 7;      // for page-based
}