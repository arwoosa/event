syntax = "proto3";

package event;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "api/common.proto";
import "third_party/validate/validate.proto";

option go_package = "event/api/event";

// Console Event Service for merchant management
service EventService {
  // Create a new event
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {
    option (google.api.http) = {
      post: "/console/events"
      body: "*"
    };
  }
  
  // Get list of events with filtering and pagination
  rpc GetEventList(GetEventListRequest) returns (EventListResponse) {
    option (google.api.http) = {
      get: "/console/events"
    };
  }
  
  // Get a single event by ID
  rpc GetEvent(api.ID) returns (Event) {
    option (google.api.http) = {
      get: "/console/events/{id}"
    };
  }
  
  // Patch event (partial update)
  rpc PatchEvent(PatchEventRequest) returns (Event) {
    option (google.api.http) = {
      patch: "/console/events/{id}"
      body: "*"
    };
  }
  
  // Delete an event
  rpc DeleteEvent(api.ID) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/console/events/{id}"
    };
  }
  
  // Update event status
  rpc UpdateEventStatus(UpdateEventStatusRequest) returns (Event) {
    option (google.api.http) = {
      put: "/console/events/{id}/status"
      body: "*"
    };
  }
  
  // Delete a specific session by ID
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/console/events/{event_id}/sessions/{session_id}"
    };
  }
}

// Public Event Service for front-end users
service PublicEventService {
  // Search public events
  rpc SearchEvents(SearchEventsRequest) returns (EventListResponse) {
    option (google.api.http) = {
      get: "/events"
    };
  }
  
  // Get a public event by ID (for sharing links)
  rpc GetEvent(api.ID) returns (Event) {
    option (google.api.http) = {
      get: "/events/{id}"
    };
  }
  
}

// Internal Service for inter-service communication
service InternalService {
  // Get event by ID without merchant validation (for internal services)
  rpc GetEventById(api.ID) returns (Event);
}

// Core Event message
message Event {
  string id = 1;
  string title = 2;
  string merchant_id = 3;
  string summary = 4;
  string status = 5; // draft, published, archived
  string visibility = 6; // public, private
  string cover_image_url = 7;
  Location location = 8;
  repeated Session sessions = 9;
  repeated DetailBlock detail = 10 [(validate.rules).repeated = {min_items: 0, max_items: 50}];
  repeated FAQ faq = 11;
  string created_at = 12;
  string created_by = 13;
  string updated_at = 14;
  string updated_by = 15;
}

// Location with GeoJSON Point structure
message Location {
  string name = 1 [(validate.rules).string.min_len = 1];
  string address = 2 [(validate.rules).string.min_len = 1];
  string place_id = 3 [(validate.rules).string.min_len = 1];
  GeoJSONPoint coordinates = 4 [(validate.rules).message.required = true];
}

message GeoJSONPoint {
  string type = 1 [(validate.rules).string.const = "Point"]; // Always "Point"
  repeated double coordinates = 2 [(validate.rules).repeated = {min_items: 2, max_items: 2}]; // [longitude, latitude]
}

// Session for time-based event scheduling
message Session {
  string id = 1;
  string name = 2;                                      // Session name (optional)
  optional int32 capacity = 3;                          // Capacity limit (optional, null means unlimited)
  string start_time = 4; // RFC3339 format
  string end_time = 5;   // RFC3339 format
}

// Detail block for structured content
message DetailBlock {
  string type = 1 [(validate.rules).string = {in: ["text", "image"]}];
  oneof data {
    TextData text_data = 2;
    ImageData image_data = 3;
  }
}

// Text block data
message TextData {
  string content = 1 [(validate.rules).string.max_len = 10000];
}

// Image block data
message ImageData {
  string url = 1 [(validate.rules).string = {min_len: 1, uri: true}];
  string alt = 2 [(validate.rules).string.max_len = 200];
  string caption = 3 [(validate.rules).string.max_len = 500];
}

// FAQ entry
message FAQ {
  string question = 1 [(validate.rules).string = {min_len: 1, max_len: 100}];
  string answer = 2 [(validate.rules).string = {min_len: 1, max_len: 300}];
}

// Request messages
message CreateEventRequest {
  string title = 1 [(validate.rules).string = {min_len: 1, max_len: 60}];
  string summary = 2 [(validate.rules).string.max_len = 160];
  // status field removed - events are always created as draft
  string visibility = 3 [(validate.rules).string = {ignore_empty: true, in: ["public", "private"]}];
  string cover_image_url = 4 [(validate.rules).string = {ignore_empty: true, uri: true}];
  optional Location location = 5;
  repeated Session sessions = 6;
  repeated DetailBlock detail = 7 [(validate.rules).repeated = {min_items: 0, max_items: 50}];
  repeated FAQ faq = 8 [(validate.rules).repeated = {min_items: 0, max_items: 20}];
}

message GetEventListRequest {
  // Pagination
  optional string page_token = 1; // for cursor-based pagination
  optional int32 page = 2 [(validate.rules).int32.gte = 1];        // for page-based pagination
  optional int32 page_size = 3 [(validate.rules).int32 = {gte: 1, lte: 100}];   // default 20, max 100
  
  // Filters
  optional string status = 4 [(validate.rules).string = {ignore_empty: true, in: ["draft", "published", "archived"]}];     // draft|published|archived
  optional string visibility = 5 [(validate.rules).string = {ignore_empty: true, in: ["public", "private"]}]; // public|private
  optional string session_start_time_from = 6; // RFC3339
  optional string session_start_time_to = 7;   // RFC3339
  optional string title_search = 8;           // full-text search
  
  // Sorting
  optional string sort_by = 9 [(validate.rules).string = {ignore_empty: true, in: ["created_at", "updated_at", "session_start_time"]}];    // created_at|updated_at|session_start_time
  optional string sort_order = 10 [(validate.rules).string = {ignore_empty: true, in: ["asc", "desc"]}]; // asc|desc, default desc
}


message PatchEventRequest {
  string id = 1 [(validate.rules).string.min_len = 1];
  optional string title = 2 [(validate.rules).string = {ignore_empty: true, min_len: 1, max_len: 60}];
  optional string summary = 3 [(validate.rules).string = {ignore_empty: true, max_len: 160}];
  optional string visibility = 4 [(validate.rules).string = {ignore_empty: true, in: ["public", "private"]}];
  optional string cover_image_url = 5 [(validate.rules).string = {ignore_empty: true, uri: true}];
  optional Location location = 6;
  repeated Session sessions = 7; // Replace all sessions if provided
  repeated DetailBlock detail = 8 [(validate.rules).repeated = {min_items: 0, max_items: 50}]; // Replace all detail blocks if provided
  repeated FAQ faq = 9 [(validate.rules).repeated = {min_items: 0, max_items: 20}]; // Replace all FAQ if provided
}

message UpdateEventStatusRequest {
  string id = 1 [(validate.rules).string.min_len = 1];
  string status = 2 [(validate.rules).string = {in: ["draft", "published", "archived"]}]; // draft|published|archived
}

message DeleteSessionRequest {
  string event_id = 1 [(validate.rules).string.min_len = 1];
  string session_id = 2 [(validate.rules).string.min_len = 1];
}

message SearchEventsRequest {
  // Pagination
  optional string page_token = 1;
  optional int32 page = 2 [(validate.rules).int32.gte = 1];
  optional int32 page_size = 3 [(validate.rules).int32 = {gte: 1, lte: 100}];
  
  // Filters
  optional string merchant_id = 4;     // filter by specific merchant
  optional string title_search = 5; // full-text search
  optional string session_start_time_from = 6;
  optional string session_start_time_to = 7;
  
  // Location-based search
  optional double location_lat = 8 [(validate.rules).double = {gte: -90, lte: 90}];
  optional double location_lng = 9 [(validate.rules).double = {gte: -180, lte: 180}];
  optional int32 location_radius = 10 [(validate.rules).int32.gte = 1]; // in meters, default 1000
  
  // Sorting
  optional string sort_by = 11 [(validate.rules).string = {ignore_empty: true, in: ["session_start_time", "created_at"]}];    // session_start_time|created_at
  optional string sort_order = 12 [(validate.rules).string = {ignore_empty: true, in: ["asc", "desc"]}]; // asc|desc
}

// Response messages
message CreateEventResponse {
  string id = 1;
  string created_at = 2;
}

message EventListResponse {
  repeated Event events = 1;
  Pagination pagination = 2;
}

message Pagination {
  optional string next_page_token = 1; // for cursor-based
  optional string prev_page_token = 2; // for cursor-based
  optional bool has_next = 3;
  optional bool has_prev = 4;
  optional int32 total_count = 5;
  optional int32 current_page = 6;     // for page-based
  optional int32 total_pages = 7;      // for page-based
}

