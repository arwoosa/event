swagger: "2.0"
info:
  title: api/event/event.proto
  version: version not set
tags:
  - name: EventService
  - name: PublicEventService
  - name: InternalService
consumes:
  - application/json
produces:
  - application/json
paths:
  /console/events:
    get:
      summary: Get list of events with filtering and pagination
      operationId: EventService_GetEventList
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/eventEventListResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_token
          description: |-
            Pagination

            for cursor-based pagination
          in: query
          required: false
          type: string
        - name: page
          description: for page-based pagination
          in: query
          required: false
          type: integer
          format: int32
        - name: page_size
          description: default 20, max 100
          in: query
          required: false
          type: integer
          format: int32
        - name: status
          description: |-
            Filters

            draft|published|archived
          in: query
          required: false
          type: string
        - name: visibility
          description: public|private
          in: query
          required: false
          type: string
        - name: session_start_time_from
          description: RFC3339
          in: query
          required: false
          type: string
        - name: session_start_time_to
          description: RFC3339
          in: query
          required: false
          type: string
        - name: title_search
          description: full-text search
          in: query
          required: false
          type: string
        - name: sort_by
          description: |-
            Sorting

            created_at|updated_at|session_start_time
          in: query
          required: false
          type: string
        - name: sort_order
          description: asc|desc, default desc
          in: query
          required: false
          type: string
      tags:
        - EventService
    post:
      summary: Create a new event
      operationId: EventService_CreateEvent
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/eventCreateEventResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/eventCreateEventRequest'
      tags:
        - EventService
  /console/events/{event_id}/sessions/{session_id}:
    delete:
      summary: Delete a specific session by ID
      operationId: EventService_DeleteSession
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: event_id
          in: path
          required: true
          type: string
        - name: session_id
          in: path
          required: true
          type: string
      tags:
        - EventService
  /console/events/{id}:
    get:
      summary: Get a single event by ID
      operationId: EventService_GetEvent
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/eventEvent'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: string
      tags:
        - EventService
    delete:
      summary: Delete an event
      operationId: EventService_DeleteEvent
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: string
      tags:
        - EventService
    patch:
      summary: Patch event (partial update)
      operationId: EventService_PatchEvent
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/eventEvent'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/EventServicePatchEventBody'
      tags:
        - EventService
  /console/events/{id}/status:
    put:
      summary: Update event status
      operationId: EventService_UpdateEventStatus
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/eventEvent'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/EventServiceUpdateEventStatusBody'
      tags:
        - EventService
  /events:
    get:
      summary: Search public events
      operationId: PublicEventService_SearchEvents
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/eventEventListResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: page_token
          description: Pagination
          in: query
          required: false
          type: string
        - name: page
          in: query
          required: false
          type: integer
          format: int32
        - name: page_size
          in: query
          required: false
          type: integer
          format: int32
        - name: merchant_id
          description: |-
            Filters

            filter by specific merchant
          in: query
          required: false
          type: string
        - name: title_search
          description: full-text search
          in: query
          required: false
          type: string
        - name: session_start_time_from
          in: query
          required: false
          type: string
        - name: session_start_time_to
          in: query
          required: false
          type: string
        - name: location_lat
          description: Location-based search
          in: query
          required: false
          type: number
          format: double
        - name: location_lng
          in: query
          required: false
          type: number
          format: double
        - name: location_radius
          description: in meters, default 1000
          in: query
          required: false
          type: integer
          format: int32
        - name: sort_by
          description: |-
            Sorting

            session_start_time|created_at
          in: query
          required: false
          type: string
        - name: sort_order
          description: asc|desc
          in: query
          required: false
          type: string
      tags:
        - PublicEventService
  /events/{id}:
    get:
      summary: Get a public event by ID (for sharing links)
      operationId: PublicEventService_GetEvent
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/eventEvent'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: string
      tags:
        - PublicEventService
definitions:
  EventServicePatchEventBody:
    type: object
    properties:
      title:
        type: string
      summary:
        type: string
      visibility:
        type: string
      cover_image_url:
        type: string
      location:
        $ref: '#/definitions/eventLocation'
      sessions:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventSession'
        title: Replace all sessions if provided
      detail:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventDetailBlock'
        title: Replace all detail blocks if provided
      faq:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventFAQ'
        title: Replace all FAQ if provided
  EventServiceUpdateEventStatusBody:
    type: object
    properties:
      status:
        type: string
        title: draft|published|archived
  eventCreateEventRequest:
    type: object
    properties:
      title:
        type: string
      summary:
        type: string
      visibility:
        type: string
        title: status field removed - events are always created as draft
      cover_image_url:
        type: string
      location:
        $ref: '#/definitions/eventLocation'
      sessions:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventSession'
      detail:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventDetailBlock'
      faq:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventFAQ'
    title: Request messages
  eventCreateEventResponse:
    type: object
    properties:
      id:
        type: string
      created_at:
        type: string
    title: Response messages
  eventDetailBlock:
    type: object
    properties:
      type:
        type: string
      text_data:
        $ref: '#/definitions/eventTextData'
      image_data:
        $ref: '#/definitions/eventImageData'
    title: Detail block for structured content
  eventEvent:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
      merchant_id:
        type: string
      summary:
        type: string
      status:
        type: string
        title: draft, published, archived
      visibility:
        type: string
        title: public, private
      cover_image_url:
        type: string
      location:
        $ref: '#/definitions/eventLocation'
      sessions:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventSession'
      detail:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventDetailBlock'
      faq:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventFAQ'
      created_at:
        type: string
      created_by:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    title: Core Event message
  eventEventListResponse:
    type: object
    properties:
      events:
        type: array
        items:
          type: object
          $ref: '#/definitions/eventEvent'
      pagination:
        $ref: '#/definitions/eventPagination'
  eventFAQ:
    type: object
    properties:
      question:
        type: string
      answer:
        type: string
    title: FAQ entry
  eventGeoJSONPoint:
    type: object
    properties:
      type:
        type: string
        title: Always "Point"
      coordinates:
        type: array
        items:
          type: number
          format: double
        title: '[longitude, latitude]'
  eventImageData:
    type: object
    properties:
      url:
        type: string
      alt:
        type: string
      caption:
        type: string
    title: Image block data
  eventLocation:
    type: object
    properties:
      name:
        type: string
      address:
        type: string
      place_id:
        type: string
      coordinates:
        $ref: '#/definitions/eventGeoJSONPoint'
    title: Location with GeoJSON Point structure
  eventPagination:
    type: object
    properties:
      next_page_token:
        type: string
        title: for cursor-based
      prev_page_token:
        type: string
        title: for cursor-based
      has_next:
        type: boolean
      has_prev:
        type: boolean
      total_count:
        type: integer
        format: int32
      current_page:
        type: integer
        format: int32
        title: for page-based
      total_pages:
        type: integer
        format: int32
        title: for page-based
  eventSession:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
        title: Session name (optional)
      capacity:
        type: integer
        format: int32
        title: Capacity limit (optional, null means unlimited)
      start_time:
        type: string
        title: RFC3339 format
      end_time:
        type: string
        title: RFC3339 format
    title: Session for time-based event scheduling
  eventTextData:
    type: object
    properties:
      content:
        type: string
    title: Text block data
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
        description: |-
          A URL/resource name that uniquely identifies the type of the serialized
          protocol buffer message. This string must contain at least
          one "/" character. The last segment of the URL's path must represent
          the fully qualified name of the type (as in
          `path/google.protobuf.Duration`). The name should be in a canonical form
          (e.g., leading "." is not accepted).

          In practice, teams usually precompile into the binary all types that they
          expect it to use in the context of Any. However, for URLs which use the
          scheme `http`, `https`, or no scheme, one can optionally set up a type
          server that maps type URLs to message definitions as follows:

          * If no scheme is provided, `https` is assumed.
          * An HTTP GET on the URL must yield a [google.protobuf.Type][]
            value in binary format, or produce an error.
          * Applications are allowed to cache lookup results based on the
            URL, or have them precompiled into a binary to avoid any
            lookup. Therefore, binary compatibility needs to be preserved
            on changes to types. (Use versioned type names to manage
            breaking changes.)

          Note: this functionality is not currently available in the official
          protobuf release, and it is not used for type URLs beginning with
          type.googleapis.com. As of May 2023, there are no widely used type server
          implementations and no plans to implement one.

          Schemes other than `http`, `https` (or the empty scheme) might be
          used with implementation specific semantics.
    additionalProperties: {}
    description: |-
      `Any` contains an arbitrary serialized protocol buffer message along with a
      URL that describes the type of the serialized message.

      Protobuf library provides support to pack/unpack Any values in the form
      of utility functions or additional generated methods of the Any type.

      Example 1: Pack and unpack a message in C++.

          Foo foo = ...;
          Any any;
          any.PackFrom(foo);
          ...
          if (any.UnpackTo(&foo)) {
            ...
          }

      Example 2: Pack and unpack a message in Java.

          Foo foo = ...;
          Any any = Any.pack(foo);
          ...
          if (any.is(Foo.class)) {
            foo = any.unpack(Foo.class);
          }
          // or ...
          if (any.isSameTypeAs(Foo.getDefaultInstance())) {
            foo = any.unpack(Foo.getDefaultInstance());
          }

       Example 3: Pack and unpack a message in Python.

          foo = Foo(...)
          any = Any()
          any.Pack(foo)
          ...
          if any.Is(Foo.DESCRIPTOR):
            any.Unpack(foo)
            ...

       Example 4: Pack and unpack a message in Go

           foo := &pb.Foo{...}
           any, err := anypb.New(foo)
           if err != nil {
             ...
           }
           ...
           foo := &pb.Foo{}
           if err := any.UnmarshalTo(foo); err != nil {
             ...
           }

      The pack methods provided by protobuf library will by default use
      'type.googleapis.com/full.type.name' as the type URL and the unpack
      methods only use the fully qualified type name after the last '/'
      in the type URL, for example "foo.bar.com/x/y.z" will yield type
      name "y.z".

      JSON
      ====
      The JSON representation of an `Any` value uses the regular
      representation of the deserialized, embedded message, with an
      additional field `@type` which contains the type URL. Example:

          package google.profile;
          message Person {
            string first_name = 1;
            string last_name = 2;
          }

          {
            "@type": "type.googleapis.com/google.profile.Person",
            "firstName": <string>,
            "lastName": <string>
          }

      If the embedded message type is well-known and has a custom JSON
      representation, that representation will be embedded adding a field
      `value` which holds the custom JSON in addition to the `@type`
      field. Example (for message [google.protobuf.Duration][]):

          {
            "@type": "type.googleapis.com/google.protobuf.Duration",
            "value": "1.212s"
          }
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
