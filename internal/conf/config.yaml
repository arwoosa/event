name: "partivo_event"
mode: "dev"
port: 8081
version: 1.0.0
time_zone: "Asia/Taipei"
log:
  level: "debug"
  filename: "logs/app.log"
  max_size: 200 #MB
  max_age: 30 #預設儲存時間
  max_backups: 7
mongodb:
  host: "127.0.0.1"
  port: 27017
  db: "partivo_event"

external:
  order_service:
    endpoint: "localhost:9090"
    timeout: "10s"
  media_service:
    endpoint: "localhost:9091"
    timeout: "30s"







